<!DOCTYPE html>
<html>
<head>
    <title>CORS API Test</title>
</head>
<body>
    <h1>Testing API from Browser</h1>
    <button onclick="testAPI()">Test API Call</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            const API_CONFIG = {
                url: 'https://live.ipms247.com/pmsinterface/getdataAPI.php',
                params: new URLSearchParams({
                    Request_Type: '-',
                    HotelCode: '55402',
                    AuthCode: '40230910707e9e1bd2-7813-11f0-9',
                    FromDate: '2025-11-03',
                    ToDate: '2025-11-04'
                }),
                body: `<RES_Request>
   <Request_Type>Rate</Request_Type>
   <Authentication>
      <HotelCode>55402</HotelCode>
      <AuthCode>40230910707e9e1bd2-7813-11f0-9</AuthCode>
   </Authentication>
   <FromDate>2025-11-03</FromDate>
   <ToDate>2025-11-04</ToDate>
</RES_Request>`
            };

            try {
                console.log('🌐 API URL:', `${API_CONFIG.url}?${API_CONFIG.params}`);
                
                const response = await fetch(`${API_CONFIG.url}?${API_CONFIG.params}`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/xml',
                    },
                    body: API_CONFIG.body
                });

                console.log('✅ Response Status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`API call failed: ${response.status}`);
                }

                const xmlText = await response.text();
                console.log('📄 Response:', xmlText);
                
                resultDiv.innerHTML = `
                    <h3>✅ Success!</h3>
                    <p>Status: ${response.status}</p>
                    <pre>${xmlText}</pre>
                `;
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ Error!</h3>
                    <p>Name: ${error.name}</p>
                    <p>Message: ${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }
    </script>
</body>
</html>

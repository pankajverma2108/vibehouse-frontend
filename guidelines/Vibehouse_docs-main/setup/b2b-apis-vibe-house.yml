openapi: 3.0.1
info:
  title: MyGate IoT Access Pro API
  description: RESTful API for MyGate IoT Access Pro Integration Service - B2B smart
    lock management system
  license:
    name: Proprietary
    url: https://mygate.com/license
  version: 1.0.0
servers:
  - url: https://knoxapi.mygate.com/partner-access
    description: Production Server
tags:
  - name: Authentication
    description: Authentication APIs
  - name: Partner Management
    description: APIs for managing partners and partner operations
  - name: Property Management
    description: APIs for managing properties and property operations
  - name: Room Management
    description: APIs for managing rooms and room access
  - name: Guest Management
    description: APIs for managing individual guests
  - name: Access Management
    description: APIs for managing access permissions and PINs

paths:
  /v1/rooms/{roomId}:
    get:
      tags:
        - Room Management
      summary: Get room details
      description: Retrieve detailed information about a specific room including lock
        info, guests, and statistics
      operationId: getRoom
      parameters:
        - name: partner-id
          in: header
          description: Partner ID for dual validation
          required: true
          example: partner123
          schema:
            type: string
        - name: mobile
          in: header
          description: User mobile number for dual validation
          required: true
          example: 9876543210
          schema:
            type: string
        - name: platform
          in: header
          description: Platform identifier (1=app, 2=web, 3=api)
          required: true
          schema:
            type: string
            enum:
              - '1'
              - '2'
              - '3'
          example: 3
        - name: session-token
          in: header
          description: 'Session token (for all platforms: web uses session tokens, app/API uses access tokens)'
          required: true
          example: your-session-token
          schema:
            type: string
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
          example: room123
      responses:
        '200':
          description: Room details retrieved successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '500':
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: Invalid authentication
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: Room not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
    put:
      tags:
        - Room Management
      summary: Update room details
      description: Update information for an existing room
      operationId: updateRoom
      parameters:
        - name: partner-id
          in: header
          description: Partner ID for dual validation
          required: true
          example: partner123
          schema:
            type: string
        - name: mobile
          in: header
          description: User mobile number for dual validation
          required: true
          example: 9876543210
          schema:
            type: string
        - name: platform
          in: header
          description: Platform identifier (1=app, 2=web, 3=api)
          required: true
          schema:
            type: string
            enum:
              - '1'
              - '2'
              - '3'
          example: 3
        - name: session-token
          in: header
          description: 'Session token (for all platforms: web uses session tokens, app/API uses access tokens)'
          required: true
          example: your-session-token
          schema:
            type: string
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
          example: room123
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
        required: true
      responses:
        '500':
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '200':
          description: Room updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: Invalid authentication
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          description: Invalid request data
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: Room not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
    delete:
      tags:
        - Room Management
      summary: Delete room
      description: Soft delete a room from the system
      operationId: deleteRoom
      parameters:
        - name: partner-id
          in: header
          description: Partner ID for dual validation
          required: true
          example: partner123
          schema:
            type: string
        - name: mobile
          in: header
          description: User mobile number for dual validation
          required: true
          example: 9876543210
          schema:
            type: string
        - name: platform
          in: header
          description: Platform identifier (1=app, 2=web, 3=api)
          required: true
          schema:
            type: string
            enum:
              - '1'
              - '2'
              - '3'
          example: 3
        - name: session-token
          in: header
          description: 'Session token (for all platforms: web uses session tokens, app/API uses access tokens)'
          required: true
          example: your-session-token
          schema:
            type: string
        - name: roomId
          in: path
          description: Room ID
          required: true
          schema:
            type: string
          example: room123
      responses:
        '200':
          description: Room deleted successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '500':
          description: Internal server error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '401':
          description: Invalid authentication
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '404':
          description: Room not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BaseResponse'

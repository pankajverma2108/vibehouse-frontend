components:
  schemas:
    RoomUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room 101 Updated
        floor:
          minimum: 0
          type: integer
          description: Floor number
          format: int32
          example: 1
        capacity:
          minimum: 1
          type: integer
          description: Room capacity
          format: int32
          example: 3
        status:
          type: string
          description: Status of the room
          example: AVAILABLE
          enum:
            - AVAILABLE
            - OCCUPIED
            - MAINTENANCE
            - OUT_OF_ORDER
            - ACTIVE
            - INACTIVE
        description:
          type: string
          description: Additional description or notes about the room
          example: Updated corner room with balcony
        room_number:
          type: string
          description: Room number
          example: 101A
        room_type:
          type: string
          description: Type of room
          example: DOUBLE
          enum:
            - SINGLE
            - DOUBLE
      description: Room update request
    BaseResponse:
      type: object
      properties:
        es:
          type: integer
          description: 'Error state indicator: 0=success, 1=error, 2=no data'
          format: int32
          example: 0
          enum:
            - 0
            - 1
            - 2
        message:
          type: string
          description: Human-readable status message
          example: Operation completed successfully
        response:
          type: string
          description: Response data as JSON string
          example: '{"id":"guest123","name":"John Doe"}'
        errorCode:
          type: integer
          description: Application-specific error code
          format: int32
          example: 1001
        statusCode:
          type: integer
          description: Internal status code
          format: int32
          example: 200
        time:
          type: integer
          description: Response timestamp as Unix timestamp in seconds
          format: int64
          example: 1704067200
      description: Standard API response wrapper
    PropertyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the property
          example: Sunset Residency Updated
        city:
          type: string
          description: City where the property is located
          example: Mumbai
        area:
          type: string
          description: Area where the property is located
          example: Bandra
        address:
          type: string
          description: Full address of the property
          example: 456 Updated Property Street, Bandra, Mumbai
        status:
          type: string
          description: Status of the property
          example: ACTIVE
          enum:
            - ACTIVE
            - INACTIVE
            - MAINTENANCE
        description:
          type: string
          description: Additional description or notes about the property
          example: Updated modern hostel with all amenities
        manager_id:
          type: string
          description: ID of the user who will manage this property
          example: user_456
        property_type:
          type: string
          description: Type of property
          example: HOSTEL
          enum:
            - HOSTEL
            - HOTEL
            - PG
            - CO_LIVING
            - STUDENT_HOUSING
        total_floors:
          minimum: 1
          type: integer
          description: Total number of floors in the property
          format: int32
          example: 4
      description: Property update request
    PartnerUpdateRequest:
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: Name of the partner organization
          example: ABC Properties Ltd
        mobile:
          pattern: ^[0-9]{10}$
          type: string
          description: Primary mobile number
          example: '9876543210'
        email:
          type: string
          description: Primary email address
          format: email
          example: contact@abcproperties.com
        city:
          maxLength: 50
          minLength: 0
          type: string
          description: City where the partner is located
          example: Bangalore
        area:
          maxLength: 100
          minLength: 0
          type: string
          description: Area or locality where the partner is located
          example: Koramangala
        address:
          maxLength: 500
          minLength: 0
          type: string
          description: Complete address of the partner
          example: 123, ABC Building, Main Street, Koramangala, Bangalore - 560034
        status:
          type: string
          description: Partner status
          example: ACTIVE
          enum:
            - ACTIVE
            - INACTIVE
        contact_person:
          maxLength: 100
          minLength: 0
          type: string
          description: Name of the primary contact person
          example: John Doe
      description: Partner update request
    GuestUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Full name of the guest
          example: Jane Smith Updated
        mobile:
          type: string
          description: Mobile number of the guest
          example: '9876543211'
        email:
          type: string
          description: Email address of the guest
          example: jane.updated@email.com
        guest_type:
          type: string
          description: Type of guest
          example: RESIDENT
          enum:
            - RESIDENT
            - VISITOR
            - STAFF
            - MAINTENANCE
        id_proof_type:
          type: string
          description: Type of ID proof
          example: AADHAR
          enum:
            - AADHAR
            - PAN
            - PASSPORT
            - DRIVING_LICENSE
            - VOTER_ID
        id_proof_number:
          type: string
          description: ID proof number
          example: '1234567890'
      description: Guest update request
    AccessUpdateRequest:
      type: object
      properties:
        status:
          type: string
          description: Status of the access
          example: ACTIVE
          enum:
            - ACTIVE
            - EXPIRED
            - REVOKED
            - SUSPENDED
        validity_type:
          type: string
          description: Type of validity for the access
          example: TIMED
          enum:
            - PERMANENT
            - TIMED
            - ONETIME
        start_time:
          type: integer
          description: Start time for access validity as Unix timestamp
          format: int64
          example: 1704067200
        end_time:
          type: integer
          description: End time for access validity as Unix timestamp
          format: int64
          example: 1704153600
        access_name:
          maxLength: 100
          type: string
          description: Name or description for the access
          example: Guest Room Access
        max_usage:
          type: integer
          description: Maximum number of times this access can be used
          format: int32
          example: 10
        upate_type:
          type: integer
          format: int32
      description: Access update request details
    AdminToggleRequest:
      required:
        - is_admin
        - property_id
        - room_id
        - user_id
      type: object
      properties:
        user_id:
          type: string
          description: User ID from mg_sd_partner_users whose admin authority to toggle
          example: user_123
        property_id:
          type: string
          description: Property ID to fetch property context
          example: prop_123
        room_id:
          type: string
          description: Room ID to identify the IoT device
          example: room_123
        is_admin:
          type: boolean
          description: true to grant admin authority, false to revoke admin authority
          example: true
      description: Admin toggle request with user_id, property_id, room_id, and is_admin
    PartnerUserCreateRequest:
      required:
        - mobile
        - name
        - role
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: Full name of the user
          example: Jane Smith
        mobile:
          pattern: ^[0-9]{10}$
          type: string
          description: Mobile number of the user
          example: '9876543210'
        email:
          type: string
          description: Email address of the user
          format: email
          example: jane.smith@abcproperties.com
        role:
          type: string
          description: Role of the user within the partner organization
          example: PARTNER_MANAGER
          enum:
            - PARTNER_ADMIN
            - PARTNER_MANAGER
        property_id:
          type: string
          description: Property ID to assign the manager to (optional, only applicable
            for PARTNER_MANAGER role)
          example: prop123
      description: Partner user creation request
    AttachLockRequest:
      required:
        - lock_serial_number
      type: object
      properties:
        lock_serial_number:
          type: string
          description: Serial number of the lock to attach
          example: MG123456
      description: Attach lock request
    RoomAccessCreateRequest:
      required:
        - access_type
        - guest_id
        - validity_type
      type: object
      properties:
        guest_id:
          type: string
          description: Unique identifier of the guest
          example: guest123
        access_type:
          type: string
          description: Type of access to create
          example: PASSCODE
          enum:
            - REMOTE
            - PASSCODE
            - FINGERPRINT
            - RFID
            - KEY
            - REMOTEKEY
            - HOME_AUTOMATION_ACCESS
            - SYSTEM
        validity_type:
          type: string
          description: Type of validity for the access
          example: TIMED
          enum:
            - O
            - P
            - T
            - PERMANENT
            - TIMED
            - ONETIME
        start_time:
          type: integer
          description: Start time for access validity as Unix timestamp in seconds
          format: int64
          example: 1704067200
        end_time:
          type: integer
          description: End time for access validity as Unix timestamp in seconds
          format: int64
          example: 1704153600
        access_name:
          maxLength: 100
          type: string
          description: Name or description for the access
          example: Guest Room Access
        passcode:
          pattern: ^[0-9]{4,8}$
          type: string
          description: Custom passcode for PASSCODE access type (4-8 digits). If not
            provided, system will generate one.
          example: '123456'
      description: Room access creation request
    PropertyCreateRequest:
      required:
        - address
        - area
        - city
        - name
      type: object
      properties:
        name:
          type: string
          description: Name of the property
          example: Sunset Residency
        city:
          type: string
          description: City where the property is located
          example: Mumbai
        area:
          type: string
          description: Area where the property is located
          example: Bandra
        address:
          type: string
          description: Full address of the property
          example: 456 Property Street, Bandra, Mumbai
        description:
          type: string
          description: Additional description or notes about the property
          example: Modern hostel with all amenities
        manager_id:
          type: string
          description: ID of the user who will manage this property
          example: user_456
        property_type:
          type: string
          description: Type of property
          example: HOSTEL
          enum:
            - HOSTEL
            - HOTEL
            - PG
            - CO_LIVING
            - STUDENT_HOUSING
        total_floors:
          minimum: 1
          type: integer
          description: Total number of floors in the property
          format: int32
          example: 3
      description: Property creation request
    RoomCreateRequest:
      required:
        - name
        - room_number
      type: object
      properties:
        name:
          type: string
          description: Name of the room
          example: Room 101
        floor:
          minimum: 0
          type: integer
          description: Floor number
          format: int32
          example: 1
        capacity:
          minimum: 1
          type: integer
          description: Room capacity
          format: int32
          example: 1
        description:
          type: string
          description: Additional description or notes about the room
          example: Corner room with balcony
        room_number:
          type: string
          description: Room number
          example: '101'
        room_type:
          type: string
          description: Type of room
          example: SINGLE
          enum:
            - SINGLE
            - DOUBLE
      description: Room creation request
    AssignManagersRequest:
      required:
        - user_ids
      type: object
      properties:
        user_ids:
          maxItems: 10
          minItems: 1
          type: array
          description: List of user IDs to assign as managers
          example:
            - user_123
            - user_456
          items:
            type: string
            description: List of user IDs to assign as managers
            example: '["user_123","user_456"]'
        create_admin:
          type: boolean
          description: Whether to create managers as IoT device admins. Defaults to
            true.
          example: true
      description: Manager assignment request
    GuestCreateRequest:
      required:
        - guest_type
        - mobile
        - name
        - room_id
      type: object
      properties:
        name:
          type: string
          description: Full name of the guest
          example: Jane Smith
        mobile:
          type: string
          description: Mobile number of the guest
          example: '9876543211'
        email:
          type: string
          description: Email address of the guest
          example: jane@email.com
        guest_type:
          type: string
          description: Type of guest
          example: RESIDENT
          enum:
            - RESIDENT
            - VISITOR
            - STAFF
            - MAINTENANCE
        room_id:
          type: string
          description: ID of the room where guest will stay
          example: room_123
        check_in_date:
          type: integer
          description: Check-in date as epoch timestamp
          format: int64
          example: 1692109200
        check_out_date:
          type: integer
          description: Expected check-out date as epoch timestamp
          format: int64
          example: 1692540000
        id_proof_type:
          type: string
          description: Type of ID proof
          example: AADHAR
          enum:
            - AADHAR
            - PAN
            - PASSPORT
            - DRIVING_LICENSE
            - VOTER_ID
        id_proof_number:
          type: string
          description: ID proof number
          example: '1234567890'
      description: Guest creation request
    AssignLocksRequest:
      required:
        - serial_numbers
      type: object
      properties:
        serial_numbers:
          maxItems: 2147483647
          minItems: 1
          type: array
          description: List of lock serial numbers to assign to the partner
          example:
            - SN001234
            - SN001235
            - SN001236
          items:
            type: string
            description: List of lock serial numbers to assign to the partner
            example: '["SN001234","SN001235","SN001236"]'
      description: JSON request with serial numbers
    MgPartnerUsers:
      type: object
      properties:
        id:
          type: string
        created:
          type: integer
          format: int64
        createdBy:
          type: integer
          format: int32
        updated:
          type: integer
          format: int64
        updatedBy:
          type: integer
          format: int32
        deleted:
          type: integer
          format: int32
        ttl:
          type: string
          format: date-time
        partnerId:
          type: string
        name:
          type: string
        mobile:
          type: string
        email:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        profile:
          $ref: '#/components/schemas/UserProfile'
        status:
          type: string
        lastLogin:
          type: integer
          format: int64
    UserProfile:
      type: object
      properties:
        imageUrl:
          type: string
        department:
          type: string
    ApiLoginRequest:
      required:
        - mobile
      type: object
      properties:
        mobile:
          pattern: ^[6-9][0-9]{9}$
          type: string
    ApiLoginResponse:
      type: object
      properties:
        es:
          type: integer
          description: 'Error state indicator: 0=success, 1=error, 2=no data'
          format: int32
          example: 0
          enum:
            - 0
            - 1
            - 2
        message:
          type: string
          description: Human-readable status message
          example: Operation completed successfully
        response:
          type: string
          description: Response data as JSON string
          example: '{"id":"guest123","name":"John Doe"}'
        errorCode:
          type: integer
          description: Application-specific error code
          format: int32
          example: 1001
        statusCode:
          type: integer
          description: Internal status code
          format: int32
          example: 200
        time:
          type: integer
          description: Response timestamp as Unix timestamp in seconds
          format: int64
          example: 1704067200
        session_token:
          type: string
        user:
          $ref: '#/components/schemas/MgPartnerUsers'
        expires_in:
          type: integer
          format: int64
    GenerateAccessRequest:
      required:
        - access_type
        - property_id
        - room_id
        - validity_type
      type: object
      properties:
        property_id:
          type: string
          description: Unique identifier of the property
          example: property123
        room_id:
          type: string
          description: Unique identifier of the room
          example: room123
        user_id:
          type: string
          description: Unique identifier of the user from mg_sd_partner_users. Required
            for REMOTE access. If provided for PASSCODE, guest will be created with
            user's mobile.
          example: user123
        access_type:
          type: string
          description: Type of access to create. PASSCODE supports all validity types.
            REMOTE only supports PERMANENT and TIMED.
          example: PASSCODE
          enum:
            - REMOTE
            - PASSCODE
            - FINGERPRINT
            - RFID
            - KEY
            - REMOTEKEY
            - HOME_AUTOMATION_ACCESS
            - SYSTEM
        validity_type:
          type: string
          description: Type of validity for the access. PASSCODE supports all types.
            REMOTE only supports PERMANENT and TIMED.
          example: TIMED
          enum:
            - O
            - P
            - T
            - PERMANENT
            - TIMED
            - ONETIME
        start_time:
          type: integer
          description: Start time for access validity as Unix timestamp in seconds.
            Required for TIMED validity. Auto-set for ONETIME (PASSCODE only).
          format: int64
          example: 1704067200
        end_time:
          type: integer
          description: End time for access validity as Unix timestamp in seconds.
            Required for TIMED validity. Auto-set for ONETIME (PASSCODE only).
          format: int64
          example: 1704153600
        access_name:
          maxLength: 100
          type: string
          description: Name or description for the access. Required if user_id is
            not provided.
          example: Guest Room Access
        passcode:
          pattern: ^[0-9]{4,8}$
          type: string
          description: Custom passcode for PASSCODE access type (4-8 digits). Only
            allowed for PASSCODE type. Not allowed for ONETIME validity.
          example: '123456'
        is_admin:
          type: boolean
          description: Grant admin authority to the user (optional, only for REMOTE
            access type with user_id). Creates app access with admin role.
          example: true
      description: Access generation request details (PASSCODE or REMOTE)
